name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package (.vsix)
        run: npx --yes @vscode/vsce package --allow-missing-repository -o usda-companion.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: usda-companion-vsix
          path: usda-companion.vsix
